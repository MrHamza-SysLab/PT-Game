<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Persona Mirror</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f1115;
      }

      #app {
        width: 100%;
        height: 100%;
      }

      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 8px 10px;
        border-radius: 8px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        color: #e7eefc;
        background: rgba(0, 0, 0, 0.5);
        z-index: 10;
      }

      #panel {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
      }

      #quiz-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
      }

      #quiz-overlay.visible {
        display: block;
      }

      #quiz-overlay.visible .dialogue-card {
        display: block;
      }

      .quiz-right-anchor {
        position: fixed;
        left: 58%;
        top: 14%;
        width: min(520px, 46vw);
        display: flex;
        flex-direction: column;
        gap: 14px;
        pointer-events: auto;
        transform: none;
        transition: top 0.08s linear, left 0.08s linear;
        z-index: 101;
      }

      .quiz-response {
        opacity: 0;
        transform: translateY(14px);
        pointer-events: none;
        padding: 14px 16px 16px;
        border-radius: 16px;
        background:
          linear-gradient(145deg, rgba(255, 214, 170, 0.1), transparent 45%),
          linear-gradient(165deg, rgba(22, 17, 14, 0.96), rgba(10, 8, 7, 0.98));
        border: 1px solid rgba(232, 176, 110, 0.5);
        box-shadow:
          0 18px 40px rgba(0, 0, 0, 0.55),
          0 0 22px rgba(255, 140, 60, 0.1),
          inset 0 1px 0 rgba(255, 230, 190, 0.12);
        backdrop-filter: blur(10px);
        transition:
          opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .quiz-response.response-visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .quiz-response-label {
        margin: 0 0 12px;
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #ffd6aa;
      }

      .intro-response {
        display: none;
        flex-direction: column;
        gap: 10px;
      }

      .intro-response.visible {
        display: flex;
      }

      #user-intro-input {
        width: 100%;
        min-height: 88px;
        resize: vertical;
        box-sizing: border-box;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(232, 176, 110, 0.4);
        background: rgba(12, 10, 9, 0.88);
        color: #f3e8d8;
        font-family: "Segoe UI", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      #user-intro-input::placeholder {
        color: rgba(243, 232, 216, 0.45);
      }

      #user-intro-input:focus {
        border-color: rgba(240, 168, 90, 0.85);
        box-shadow: 0 0 0 3px rgba(240, 168, 90, 0.15);
      }

      #intro-next-btn {
        width: auto;
        align-self: flex-end;
        min-width: 120px;
        padding: 11px 22px;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff8ee;
        background: linear-gradient(135deg, rgba(224, 122, 31, 0.92), rgba(196, 90, 18, 0.9));
        border: 1px solid rgba(255, 200, 130, 0.55);
        border-radius: 12px;
        cursor: pointer;
        font-family: "Segoe UI", Arial, sans-serif;
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }

      #intro-next-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 8px 20px rgba(196, 90, 18, 0.35);
      }

      #intro-next-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .dialogue-card {
        display: none;
        position: relative;
        border-radius: 20px 20px 20px 6px;
        overflow: visible;
        background:
          linear-gradient(145deg, rgba(255, 214, 170, 0.12), transparent 42%),
          linear-gradient(165deg, rgba(28, 22, 18, 0.94), rgba(12, 10, 9, 0.96));
        border: 1px solid rgba(232, 176, 110, 0.45);
        box-shadow:
          0 22px 48px rgba(0, 0, 0, 0.55),
          0 0 28px rgba(255, 140, 60, 0.12),
          inset 0 1px 0 rgba(255, 230, 190, 0.14);
        backdrop-filter: blur(10px);
        opacity: 0;
      }

      .dialogue-card::before {
        content: "";
        position: absolute;
        left: -11px;
        top: 34px;
        width: 18px;
        height: 18px;
        background: rgba(18, 14, 12, 0.96);
        border-left: 1px solid rgba(232, 176, 110, 0.45);
        border-bottom: 1px solid rgba(232, 176, 110, 0.45);
        transform: rotate(45deg);
        z-index: 0;
      }

      .dialogue-card.visible {
        display: block;
        animation: dialogueIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes dialogueIn {
        from {
          opacity: 0;
          transform: translateX(18px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateX(0) scale(1);
        }
      }

      .dialogue-header {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px 10px;
        border-bottom: 1px solid rgba(232, 176, 110, 0.18);
      }

      .speaker-avatar {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 18px;
        color: #fff8ee;
        flex-shrink: 0;
        box-shadow:
          0 0 0 2px rgba(255, 210, 150, 0.25),
          0 6px 16px rgba(255, 120, 40, 0.35);
      }

      .speaker-avatar.customer { background: linear-gradient(135deg, #ff6b6b, #c92a2a); }
      .speaker-avatar.agent { background: linear-gradient(145deg, #ffb347, #e07a1f 55%, #c45a12); }
      .speaker-avatar.receptionist { background: linear-gradient(135deg, #4dabf7, #1864ab); }

      .speaker-meta h2 {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        color: #fff4e6;
        font-family: Georgia, "Times New Roman", serif;
        letter-spacing: 0.02em;
      }

      .speaker-role {
        display: inline-block;
        margin-top: 5px;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffe2b8;
        background: rgba(255, 160, 70, 0.16);
        border: 1px solid rgba(232, 176, 110, 0.35);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .dialogue-body {
        position: relative;
        z-index: 1;
        padding: 12px 16px 16px;
      }

      .dialogue-text {
        margin: 0;
        min-height: 72px;
        font-size: 15px;
        line-height: 1.65;
        color: #f3e8d8;
        font-family: "Segoe UI", Arial, sans-serif;
        white-space: pre-wrap;
      }

      .dialogue-text .typed-text {
        display: inline;
      }

      .dialogue-text .cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: #f0a85a;
        margin-left: 2px;
        vertical-align: text-bottom;
        animation: blink 0.8s step-end infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .dialogue-choices {
        display: grid;
        gap: 12px;
        padding: 0;
      }

      .quiz-response.response-visible .choice-btn {
        animation: choiceIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
      }

      .quiz-response.response-visible .choice-btn:nth-child(1) {
        animation-delay: 0.08s;
      }

      .quiz-response.response-visible .choice-btn:nth-child(2) {
        animation-delay: 0.16s;
      }

      @keyframes choiceIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .menu-card {
        padding: 16px;
        border-radius: 14px;
        font-family: Arial, sans-serif;
        color: #f3f7ff;
        background: rgba(5, 8, 16, 0.86);
        border: 1px solid rgba(145, 175, 255, 0.22);
        backdrop-filter: blur(6px);
      }

      #click-to-play {
        display: none !important;
      }

      canvas {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 1;
      }

      #analytics-overlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 102;
        pointer-events: none;
      }

      #analytics-overlay.visible {
        display: block;
        animation: analyticsFadeIn 0.65s ease forwards;
      }

      @keyframes analyticsFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .analytics-panel {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(780px, calc(92vw - 32px));
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        padding: 24px 28px 22px;
        border-radius: 20px;
        pointer-events: auto;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #f3e8d8;
        background:
          linear-gradient(145deg, rgba(255, 214, 170, 0.1), transparent 42%),
          linear-gradient(165deg, rgba(22, 17, 14, 0.96), rgba(10, 8, 7, 0.98));
        border: 1px solid rgba(232, 176, 110, 0.5);
        box-shadow:
          0 22px 48px rgba(0, 0, 0, 0.55),
          0 0 28px rgba(255, 140, 60, 0.12),
          inset 0 1px 0 rgba(255, 230, 190, 0.14);
        backdrop-filter: blur(10px);
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 176, 110, 0.45) transparent;
      }

      .analytics-panel h2 {
        margin: 0 0 8px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(20px, 2.2vw, 26px);
        color: #fff4e6;
        letter-spacing: 0.02em;
        text-align: center;
      }

      .analytics-subtitle {
        margin: 0 auto 20px;
        max-width: 520px;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(243, 232, 216, 0.72);
        text-align: center;
      }

      .analytics-hero {
        display: flex;
        justify-content: center;
        margin-bottom: 18px;
      }

      .analytics-ring {
        position: relative;
        width: 132px;
        height: 132px;
      }

      .analytics-ring svg {
        display: block;
        transform: rotate(-90deg);
      }

      .analytics-ring-bg {
        fill: none;
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 10;
      }

      .analytics-ring-fill {
        fill: none;
        stroke-width: 10;
        stroke-linecap: round;
        transition: stroke-dashoffset 1s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .analytics-ring--sm .analytics-ring-bg,
      .analytics-ring--sm .analytics-ring-fill {
        stroke-width: 9;
      }

      .analytics-ring-label {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        text-align: center;
        padding: 0 12px;
      }

      .analytics-ring-pct {
        font-weight: 700;
        line-height: 1;
        color: #fff8ee;
        font-family: Georgia, "Times New Roman", serif;
      }

      .analytics-ring-trait {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #ffd6aa;
        line-height: 1.3;
      }

      .analytics-ring--hero .analytics-ring-pct {
        font-size: 30px;
      }

      .analytics-ring--hero .analytics-ring-trait {
        font-size: 9px;
        letter-spacing: 0.1em;
      }

      .analytics-ring--sm {
        width: 108px;
        height: 108px;
      }

      .analytics-ring--sm .analytics-ring-pct {
        font-size: 18px;
      }

      .analytics-traits {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }

      .trait-ring-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .trait-ring-name {
        font-size: 12px;
        font-weight: 700;
        color: #ffe2b8;
        text-align: center;
        line-height: 1.25;
      }

      .trait-ring-level {
        font-size: 10px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255, 210, 150, 0.85);
        text-align: center;
      }

      @media (max-width: 640px) {
        .analytics-traits {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }

      @media (max-width: 420px) {
        .analytics-traits {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      .analytics-section {
        margin-bottom: 16px;
        padding-top: 14px;
        border-top: 1px solid rgba(232, 176, 110, 0.18);
      }

      .analytics-feedback-section {
        text-align: center;
      }

      .analytics-feedback-section h3 {
        text-align: center;
      }

      .analytics-feedback-section p {
        margin: 0;
        max-width: 640px;
        margin-inline: auto;
        font-size: 13px;
        line-height: 1.65;
        color: rgba(243, 232, 216, 0.88);
      }

      .analytics-insights-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin-bottom: 16px;
      }

      .analytics-insight-col {
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.22);
        border: 1px solid rgba(232, 176, 110, 0.15);
      }

      .analytics-insight-col h3 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ffd6aa;
      }

      .analytics-insight-col ul {
        margin: 0;
        padding-left: 16px;
        display: grid;
        gap: 5px;
      }

      .analytics-insight-col li {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: rgba(243, 232, 216, 0.88);
      }

      @media (max-width: 640px) {
        .analytics-insights-row {
          grid-template-columns: 1fr;
        }
      }

      .analytics-section h3 {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ffd6aa;
      }

      .analytics-section p,
      .analytics-section li {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
        color: rgba(243, 232, 216, 0.88);
      }

      .analytics-section ul {
        margin: 0;
        padding-left: 18px;
        display: grid;
        gap: 6px;
      }

      .analytics-feedback-block {
        display: none;
      }

      #analytics-finish-btn {
        width: 100%;
        margin-top: 6px;
        text-align: center;
      }

      #result-panel {
        position: fixed;
        left: 50%;
        top: 50%;
        bottom: auto;
        transform: translate(-50%, -50%);
        width: min(780px, calc(92vw - 32px));
        pointer-events: auto;
      }

      #scenario-title {
        margin: 0 0 8px;
        font-size: 20px;
      }

      #dialogue {
        margin: 0 0 14px;
        line-height: 1.5;
      }

      #choices {
        display: grid;
        gap: 10px;
      }

      .choice-btn,
      #restart-btn {
        width: 100%;
        padding: 13px 15px;
        text-align: left;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.45;
        color: #fff4e6;
        background: linear-gradient(135deg, rgba(48, 34, 22, 0.95), rgba(28, 20, 14, 0.98));
        border: 1px solid rgba(232, 176, 110, 0.45);
        border-radius: 12px;
        cursor: pointer;
        box-shadow: inset 0 1px 0 rgba(255, 230, 190, 0.08);
        transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .choice-btn:hover,
      #restart-btn:hover {
        background: linear-gradient(135deg, rgba(84, 52, 24, 0.98), rgba(52, 34, 18, 0.98));
        border-color: rgba(255, 200, 130, 0.75);
        box-shadow:
          0 6px 16px rgba(196, 90, 18, 0.25),
          inset 0 1px 0 rgba(255, 230, 190, 0.14);
        transform: translateY(-1px);
      }

      #result-screen {
        display: none;
      }

      .screen-visible {
        display: block !important;
      }

      #result-screen h2 {
        margin: 0 0 10px;
      }

      #result-summary {
        margin: 0 0 12px;
      }

      #title-screen {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 60;
        pointer-events: none;
      }

      #title-screen.screen-visible {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 7vh;
        animation: titleFadeIn 0.9s ease forwards;
      }

      .title-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: auto;
      }

      @keyframes titleFadeIn {
        from { opacity: 0; transform: translateY(-16px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .hanging-title-wrap {
        display: inline-block;
        transform-origin: top center;
        animation: hangSwing 3.6s ease-in-out infinite;
      }

      .hanging-rope {
        width: 2px;
        height: 48px;
        margin: 0 auto;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(228, 236, 255, 0.72));
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.12);
      }

      .hanging-title {
        margin: 10px 0 0;
        padding: 16px 34px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(30px, 5.5vw, 56px);
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #f8f4e8;
        text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        background: linear-gradient(145deg, rgba(32, 38, 58, 0.94), rgba(14, 18, 30, 0.9));
        border: 2px solid rgba(212, 184, 118, 0.58);
        border-radius: 8px;
        box-shadow: 0 16px 42px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        white-space: nowrap;
      }

      @keyframes hangSwing {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }

      #play-btn {
        position: relative;
        display: block;
        margin: 28px 0 0;
        min-width: 220px;
        padding: 16px 36px;
        overflow: hidden;
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #fff8e8;
        background: linear-gradient(135deg, rgba(48, 42, 28, 0.95), rgba(18, 16, 12, 0.92));
        border: 2px solid rgba(212, 184, 118, 0.72);
        border-radius: 10px;
        box-shadow:
          0 10px 32px rgba(0, 0, 0, 0.42),
          0 0 24px rgba(212, 184, 118, 0.14),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        cursor: pointer;
        transition:
          transform 0.22s ease,
          border-color 0.22s ease,
          box-shadow 0.22s ease,
          color 0.22s ease;
        animation: playBtnIn 0.9s ease 0.4s both, playBtnPulse 2.8s ease-in-out 1.3s infinite;
      }

      #play-btn::before {
        content: "▶";
        margin-right: 10px;
        font-size: 12px;
        color: #d4b876;
        vertical-align: middle;
      }

      #play-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          transparent 30%,
          rgba(255, 236, 190, 0.18) 48%,
          transparent 66%
        );
        transform: translateX(-130%);
        transition: transform 0.55s ease;
        pointer-events: none;
      }

      @keyframes playBtnIn {
        from { opacity: 0; transform: translateY(18px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes playBtnPulse {
        0%, 100% {
          box-shadow:
            0 10px 32px rgba(0, 0, 0, 0.42),
            0 0 20px rgba(212, 184, 118, 0.12),
            inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }
        50% {
          box-shadow:
            0 12px 36px rgba(0, 0, 0, 0.48),
            0 0 34px rgba(212, 184, 118, 0.28),
            inset 0 1px 0 rgba(255, 255, 255, 0.16);
        }
      }

      #play-btn:hover {
        color: #fffdf6;
        border-color: rgba(232, 206, 148, 0.95);
        transform: translateY(-3px) scale(1.03);
        box-shadow:
          0 16px 40px rgba(0, 0, 0, 0.5),
          0 0 40px rgba(212, 184, 118, 0.35),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
      }

      #play-btn:hover::after {
        transform: translateX(130%);
      }

      #play-btn:active {
        transform: translateY(-1px) scale(1.01);
      }

      #play-btn:disabled {
        opacity: 0.72;
        cursor: wait;
        animation: none;
        transform: none;
      }

      #music-toggle {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 200;
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        padding: 0;
        border-radius: 14px;
